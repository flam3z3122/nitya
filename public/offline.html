<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>daymark — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f9f6; color: #1c2828; padding: 24px; }
      .card { text-align: center; max-width: 360px; }
      .icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; background: #4f947b; }
      .icon svg { width: 34px; height: 34px; }
      h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
      p { font-size: 14px; line-height: 1.5; color: #71807e; margin-bottom: 20px; }
      button { font-family: inherit; font-size: 14px; font-weight: 600; color: #fff; background: #4f947b; border: none; border-radius: 12px; padding: 12px 28px; cursor: pointer; transition: background 0.2s ease; }
      button:hover { background: #3d7d66; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 12 13"/>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>daymark needs a connection to sync your data. Check your internet connection and try again.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
